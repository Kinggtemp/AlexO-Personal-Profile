<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./Login.css" />
    <title>Login Page Project</title>
  </head>

  <body>
    <main class="Header">
      <div class="container" id="container">
        <div
          class="form-container sign-up"
          id="signup-form"
          inert
          aria-hidden="true"
        >
          <form>
            <h1>Create Account</h1>
            <div class="social-icons">
              <a href="#" class="icon" aria-label="Continue with Google"
                ><i class="fa-brands fa-google-plus-g" aria-hidden="true"></i
              ></a>
              <a href="#" class="icon" aria-label="Continue with Facebook"
                ><i class="fa-brands fa-facebook-f" aria-hidden="true"></i
              ></a>
              <a href="#" class="icon" aria-label="Continue with GitHub"
                ><i class="fa-brands fa-github" aria-hidden="true"></i
              ></a>
              <a href="#" class="icon" aria-label="Continue with LinkedIn"
                ><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i
              ></a>
            </div>
            <span>or use your email for registration</span>
            <input
              type="text"
              placeholder="Name"
              aria-label="Name"
              autocomplete="name"
            />
            <input
              type="email"
              placeholder="Email"
              aria-label="Email"
              autocomplete="email"
              inputmode="email"
              autocapitalize="none"
            />
            <input
              type="password"
              placeholder="Password"
              aria-label="Password"
              autocomplete="new-password"
            />
            <button>Sign Up</button>
          </form>
        </div>
        <div class="form-container sign-in" id="signin-form">
          <form>
            <h1>Sign In</h1>
            <div class="social-icons">
              <a href="#" class="icon" aria-label="Continue with Google"
                ><i class="fa-brands fa-google-plus-g" aria-hidden="true"></i
              ></a>
              <a href="#" class="icon" aria-label="Continue with Facebook"
                ><i class="fa-brands fa-facebook-f" aria-hidden="true"></i
              ></a>
              <a href="#" class="icon" aria-label="Continue with GitHub"
                ><i class="fa-brands fa-github" aria-hidden="true"></i
              ></a>
              <a href="#" class="icon" aria-label="Continue with LinkedIn"
                ><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i
              ></a>
            </div>
            <span>or use your email password</span>
            <input
              type="email"
              placeholder="Email"
              aria-label="Email"
              autocomplete="email"
              inputmode="email"
              autocapitalize="none"
            />
            <input
              type="password"
              placeholder="Password"
              aria-label="Password"
              autocomplete="current-password"
            />
            <a href="#">Forgot Your Password?</a>
            <button>Sign In</button>
          </form>
        </div>
        <div class="toggle-container">
          <div class="toggle">
            <div class="toggle-panel toggle-left">
              <h1>Welcome Back!</h1>
              <p>Enter your personal details to use all of site features</p>
              <button
                class="hidden"
                id="login"
                type="button"
                aria-controls="signin-form"
              >
                Sign In
              </button>
            </div>
            <div class="toggle-panel toggle-right">
              <h1>Hello, Friend!</h1>
              <p>
                Register with your personal details to use all of site features
              </p>
              <button
                class="hidden"
                id="register"
                type="button"
                aria-controls="signup-form"
              >
                Sign Up
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./Login.js"></script>
  </body>
</html>
